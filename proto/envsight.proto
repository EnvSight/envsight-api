syntax = "proto3";

package envsight;

option go_package = "github.com/EnvSight/envsight-api/pb;pb";

// AgentService defines the bidirectional contract between the EnvSight Agent
// and the EnvSight Server.
service AgentService {
  // Register is called once on agent startup to announce the host. The server
  // either issues a new UUIDv7 or confirms the cached one.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // StreamStatus is a bidirectional stream: the agent pushes NodeState
  // telemetry, and the server pushes ServerCommand (e.g. request_detail,
  // diagnose) back to the agent.
  rpc StreamStatus(stream NodeState) returns (stream ServerCommand);
}

message RegisterRequest {
  string agent_uuid = 1;   // Empty on first registration; cached UUID otherwise
  HostInfo host_info = 2;  // Static host inventory collected at startup
  string token = 3;        // Agent API token (also sent as gRPC Bearer metadata)
}

message RegisterResponse {
  string agent_uuid = 1;   // Server-issued or confirmed UUID
  bool success = 2;
  string message = 3;      // Error description when success == false
}

// HostInfo carries the static, rarely-changing facts about a machine.
message HostInfo {
  string hostname = 1;
  string os_info = 2;
  string instance_id = 3;  // Optional cloud provider instance ID
  int32 cpu_cores = 4;
  uint64 mem_total_mb = 5;
  uint64 disk_total_mb = 6;
  repeated GpuInfo gpus = 7;
  string cloud_provider = 8;

  // Swap capacity. Static, so it belongs with the rest of the inventory
  // rather than being repeated on every heartbeat beside swap_used_mb.
  optional uint64 swap_total_mb = 9;
}

// NodeState is the dynamic per-heartbeat payload streamed by the agent.
message NodeState {
  string agent_uuid = 1;
  Metrics metrics = 2;
  repeated PortInfo ports = 3;
  repeated GpuInfo gpus = 4;       // GPU usage may change dynamically
  bool has_physical_tty = 5;
  // Field 6 (is_idle) removed: idle determination moved server-side so the
  // thresholds are configured in one place (the server), not baked into every
  // agent. Agents only report raw signals (cpu/ports/gpu/tty).
  reserved 6;
  reserved "is_idle";
  // True on a baseline beat, false on a burst one, and it means two things
  // that are the same thing: persist a metrics row, and trust every field
  // here.
  //
  // A burst beat carries only what changes between beats — the metrics and
  // GPU utilisation — and omits ports, filesystems and GPU processes, which
  // do not change every fifteen seconds and cost far more to collect and to
  // send than everything else combined. A beat that reports them is around
  // 3.2KB; one that does not is 205 bytes.
  //
  // So the server must merge rather than replace: on a burst beat, the fields
  // it does not carry keep their previous values. It cannot work this out
  // from the message, because proto3 cannot tell an empty repeated field from
  // an absent one — a host with no listening ports and a beat that did not
  // look are identical on the wire. This flag is the only thing that
  // distinguishes them.
  //
  // The consequence, which is deliberate: a machine that stops listening on
  // every port keeps showing its old ports until the next baseline beat, at
  // most two minutes later. Idle detection is unaffected — it only ever runs
  // on beats where this is true.
  bool require_db_save = 7;
  repeated GpuProcess gpu_processes = 8;
  string diagnostic_snapshot = 9;  // Text snapshot produced by the diagnose command

  // 10 held a repeated FilesystemInfo, removed with the fullest-mount fields
  // in Metrics and for the same reason: producing it means enumerating every
  // mount, and that enumeration is what can hang.
  reserved 10;
  reserved "filesystems";
}

// Metrics is one machine's reading at one instant.
//
// Everything added after field 8 is `optional`, and deliberately so. proto3
// cannot tell a zero from an absent value in a plain scalar, and for every one
// of these fields zero is a reading a machine genuinely produces: no network
// traffic, no steal, no swap in use. Without explicit presence:
//
//   - the agent's first beat, which has no previous counter to subtract from,
//     would report 0 B/s — a host saturating its link would draw as idle;
//   - the server could not tell an agent too old to send a field from a new
//     one reporting zero, and would chart a flat line along the floor for
//     every machine that has not been upgraded yet.
//
// One presence bit per field, against roughly 8KB per agent per day. The
// wrong-looking chart costs more.
message Metrics {
  double cpu_percent = 1;
  uint64 mem_used_mb = 2;
  uint64 mem_total_mb = 3;         // Kept for backward compat and quick percentage calc
  uint64 disk_used_mb = 4;
  uint64 uptime_seconds = 5;
  double load_1 = 6;
  double load_5 = 7;
  double load_15 = 8;

  // --- CPU breakdown -------------------------------------------------------
  // Both are shares of the same interval cpu_percent covers, derived from
  // /proc/stat deltas rather than sampled.

  // Time the hypervisor gave to somebody else. On a cloud host this is the
  // only evidence that slowness is the neighbour's fault and not the
  // application's — the guest sees low utilisation and high latency, and
  // nothing else in this message explains it.
  optional double cpu_steal_percent = 9;

  // Time blocked on I/O. High iowait alongside high disk_await_ms is the
  // difference between "the CPU is busy" and "the CPU is waiting for a disk".
  optional double cpu_iowait_percent = 10;

  // --- Memory --------------------------------------------------------------

  // What the kernel believes can still be allocated without swapping. Reported
  // alongside mem_used_mb rather than replacing it: "used" is computed
  // differently on every platform and counts caches the kernel would happily
  // drop, so it answers a different question than "is this host under memory
  // pressure".
  optional uint64 mem_available_mb = 11;

  // A host that has started swapping is a host in trouble, and mem_used_mb
  // shows none of it.
  optional uint64 swap_used_mb = 12;

  // --- Filesystem capacity -------------------------------------------------

  // Inodes on the root filesystem. The classic cause of "the disk is not full
  // but writes fail", and invisible in every byte-based measure. Free: it
  // comes back from the same statfs that fills disk_used_mb.
  optional double disk_inodes_percent = 15;

  // 13 and 14 held disk_fullest_percent and disk_fullest_mount, and are not
  // to be reused.
  //
  // They existed to cover a real blind spot — disk_used_mb measures the root
  // filesystem, and the partition that fills is often /var under log growth
  // or a separately mounted data volume. Finding the fullest one means
  // enumerating every mount, and that enumeration is the problem.
  //
  // statfs on an unreachable NFS or CIFS mount blocks in the kernel, and a
  // context cancels the wait rather than the syscall, so the only defence is
  // a list of filesystem types never to touch. The same list has to exclude
  // tmpfs, which sits at 100% on a healthy host, and squashfs, one of which
  // is mounted at exactly 100% for every installed snap, and overlay mounts,
  // which report a disk already counted. Every entry is a platform-specific
  // judgement, and each one can be wrong in one of two directions: park a
  // goroutine forever on a dead file server, or report every fresh Ubuntu
  // machine as full on its first day.
  //
  // A root-only reading needs none of it. The blind spot is real and belongs
  // to hosts somebody deliberately partitioned, which is a smaller set than
  // the set of hosts a wrong filter would misreport.
  reserved 13, 14;
  reserved "disk_fullest_percent", "disk_fullest_mount";

  // --- Disk I/O ------------------------------------------------------------
  // Rates over the interval, from /proc/diskstats deltas.

  // Share of the interval the device had I/O in flight — what `iostat -x`
  // calls %util. Throughput alone cannot distinguish an idle disk from a
  // saturated one: 5 MB/s is nothing for an NVMe and everything for a tired
  // spindle. Known limitation: on devices with deep queues this saturates at
  // 100% before the device does, which is why await travels with it.
  optional double disk_util_percent = 16;

  // Mean wait per I/O. The number that actually says a disk is the
  // bottleneck.
  optional double disk_await_ms = 17;

  optional double disk_read_bps = 18;
  optional double disk_write_bps = 19;

  // --- Network -------------------------------------------------------------
  // Physical interfaces only. Loopback would count local traffic that never
  // leaves the host, and container bridges (docker0, br-*, veth*) count the
  // same packets twice — once on the bridge and once on the interface behind
  // it. Which interfaces were summed is not carried here; a host where the
  // answer is surprising is a host with bridges, and NodeState.filesystems is
  // not the place to explain it either.
  optional double net_rx_bps = 20;
  optional double net_tx_bps = 21;

  // --- Process counts ------------------------------------------------------

  // A count that changes shape when something is wrong: a leak that forks
  // without reaping, or a service restarting in a loop. Free — it comes off
  // /proc/loadavg with the numbers below.
  optional uint32 process_count = 22;

  // Processes in uninterruptible sleep: stuck on I/O that cannot be
  // interrupted, usually a disk or an NFS mount. They cannot be killed —
  // kill -9 does nothing, because the signal is delivered on the way back to
  // userspace and they never get there.
  //
  // This is the field that disambiguates load average, which on Linux counts
  // these processes as well as runnable ones. A load of 50 means either
  //
  //     cpu 95%, blocked 0   — saturated, and behaving normally
  //     cpu  3%, blocked 48  — storage is wedged and nothing can be killed
  //
  // and nothing else in this message tells the two apart. Alongside
  // cpu_iowait_percent and disk_await_ms it completes the picture: how much
  // the CPU waits, how slow the device is, and how many processes are stuck.
  optional uint32 procs_blocked = 26;

  // 23, 24, 25 held tcp_established, tcp_time_wait and thread_count in
  // v1.3.0 and are not to be reused. That release is a public immutable tag
  // recorded in Go's checksum database, so an implementation generated from
  // it may exist even though nothing here consumed it.
  //
  // They were removed for the same reason: no threshold that means anything
  // across hosts. Twelve thousand connections in TIME_WAIT, or four thousand
  // threads, is healthy on one machine and broken on the next, so the chart
  // is a line with no reference — unlike a CPU share or a disk percentage,
  // which read identically everywhere. Diagnosing either needs to know which
  // application, which port, which peer, and a scalar carries none of that.
  //
  // Dropping the connection counts also leaves the door open: with only
  // listening sockets to report, the expensive part of enumerating every
  // connection can be skipped later. Keeping a total would have required it
  // forever.
  reserved 23, 24, 25;
  reserved "thread_count", "tcp_established", "tcp_time_wait";
}

message GpuInfo {
  string vendor = 1;
  string model = 2;
  float usage_percent = 3;
  uint64 vram_total_mb = 4;
  uint64 vram_used_mb = 5;
}

message GpuProcess {
  uint32 pid = 1;
  string process_name = 2;
  string user = 3;           // User running the process
  uint64 vram_used_mb = 4;
  uint32 gpu_index = 5;      // Which GPU this process is running on
}

message PortInfo {
  uint32 port = 1;
  string process_name = 2;
  string cmdline = 3;
  string user = 4;           // User running the process
}

message ServerCommand {
  string action = 1;         // e.g. "request_detail", "diagnose"
  string payload = 2;
}
